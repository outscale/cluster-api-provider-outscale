name: Unit & quickstart E2E tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/unit-quickstart-e2e-test.yaml"
      - ".github/actions/deploy_cluster/**"
      - "**.go"
      - "go.*"
      - "**.yaml"
      - "!capm.yaml"
      - "!osc-secret.yaml"
      - "!example/**.yaml"
      - "!.github/**.yaml"
      - "!testclean/**"
      - "!helm/**"
      - "Makefile"
      - "Dockerfile"
      - "hack/*.sh"
      - "!docs/src/**"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 🧪 unit tests
      run: |
        make unit-test
        cat covers.txt
      shell: bash
  integration:
    runs-on: [self-hosted, linux, local]
    needs: [unit]
    permissions:
      id-token: write
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 🔒🧹 Setup Vault & Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-cluster-api-provider-outscale
        exclude_resource_types: access_key
    - name: 🧪 integration tests
      run: |
        make integration-test
      shell: bash
      env:
        IMG_NAME: ${{ vars.IMG_UPGRADE_FROM }}
        VM_TYPE: "tinav7.c1r1p3"
  e2e-quickstart:
    runs-on: [self-hosted, linux, kube]
    needs: [integration]
    permissions:
      id-token: write
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.34.9
    - name: ⬇️ Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1
    - name: ⬇️ Install kustomize
      uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
      with:
        kustomize-version: 5.7.1
    - name: 🔎 Check IP
      id: ip
      run: |
        echo "ip=`curl -s -S --retry 5 --retry-all-errors https://api.ipify.org`" | tee $GITHUB_OUTPUT
    - name: 🔒🧹 Setup Vault & Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-cluster-api-provider-outscale
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 👷 Deploy management cluster
      id: management
      timeout-minutes: 40
      uses: outscale/.github/kube-setup@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
      with:
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ vars.IMG_MANAGEMENT }}
        CERT_MANAGER: "true"
        PRELOADER_SNAPSHOT: "true"
        ALLOW_FROM: ${{ vars.ALLOW_FROM }}
        vault_role: outscale-cluster-api-provider-outscale
        vault_token: ${{ steps.secrets.outputs.vault_token }}
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 📦 Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 🐳 Login to Harbor
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: 📦 Push Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/cluster-api-outscale-controllers"
        IMAGE_TAG: "${{ github.sha }}-amd64"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/cluster-api-outscale-controllers"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 🔐 Create CAPOSC ns and credentials
      run: make credentials
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 🧪 Launch quickstart e2e tests
      timeout-minutes: 180
      run: |
        from=`echo ${{ vars.IMG_UPGRADE_FROM }} | sed 's/.*kubernetes-\(v[^-]*\)-.*/\1/'`
        to=`echo ${{ vars.IMG_UPGRADE_TO }} | sed 's/.*kubernetes-\(v[^-]*\)-.*/\1/'`
        export KUBERNETES_VERSION=$from
        export KUBERNETES_VERSION_UPGRADE_FROM=$from
        export KUBERNETES_VERSION_UPGRADE_TO=$to
        make e2etest
      shell: bash
      id: e2etest
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        CCM_OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        CCM_OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        CCM_OSC_REGION: ${{ steps.secrets.outputs.region }}
        IMG: ${{ vars.REGISTRY }}/outscale/cluster-api-outscale-controllers:${{ github.sha }}
        IMG_UPGRADE_FROM: ${{ vars.IMG_UPGRADE_FROM }}
        IMG_UPGRADE_TO: ${{ vars.IMG_UPGRADE_TO }}
        PRELOAD_SNAPSHOT_ID: ${{ steps.management.outputs.SNAPSHOT_ID }}
    - name: 📝 Get CAPOSC state/logs
      run: |
        echo "**** pod state"
        kubectl describe po -n cluster-api-provider-outscale-system
        echo "**** pod logs"
        make logs-capo
      if: ${{ failure() && steps.e2etest.conclusion == 'failure' }}
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        CAPO_NAMESPACE: cluster-api-provider-outscale-system
    - name: 📝 Get cluster api logs
      run: make logs-capi
      if: ${{ failure() && steps.e2etest.conclusion == 'failure' }}
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        CAPI_NAMESPACE: capi-kubeadm-bootstrap-system
    - name: 👷 Teardown management cluster
      if: ${{ always() }}
      uses: outscale/.github/kube-teardown@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
      with:
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
