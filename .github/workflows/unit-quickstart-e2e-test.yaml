name: Unit & quickstart E2E tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/unit-quickstart-e2e-test.yaml"
      - ".github/actions/deploy_cluster/**"
      - "**.go"
      - "go.*"
      - "**.yaml"
      - "!capm.yaml"
      - "!osc-secret.yaml"
      - "!example/**.yaml"
      - "!.github/**.yaml"
      - "!testclean/**"
      - "!helm/**"
      - "Makefile"
      - "Dockerfile"
      - "hack/*.sh"
      - "!docs/src/**"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 🧪 unit tests
      run: |
        make unit-test
        cat covers.txt
      shell: bash
  e2e-quickstart:
    runs-on: [self-hosted, linux, kube]
    needs: [unit]
    permissions:
      id-token: write
    steps:
    - name: 🩹 Safe config for 💩 DNS
      run: |
        sed 's/options /options use-vc single-request attempts:5 /' < /etc/resolv.conf > /etc/resolv.conf.new
        cat /etc/resolv.conf.new > /etc/resolv.conf
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.34.9
    - name: ⬇️ Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0
    - name: ⬇️ Install kustomize
      uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
      with:
        kustomize-version: 5.7.1
    - name: 🔎 Check IP
      id: ip
      run: |
        echo "ip=`curl -s -S --retry 5 --retry-all-errors https://api.ipify.org`" | tee $GITHUB_OUTPUT
    - name: 🔒🧹 Setup Vault & Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@vault_action # @2806dfed40e08ccd51bee7edcac524fd02a67f06 # v1.3.0
      with:
        vault_role: outscale-cluster-api-provider-outscale
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 👷 Deploy management cluster
      id: management
      uses: outscale/.github/deploy-cluster@vault_action
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ vars.IMG_MANAGEMENT }}
        CERT_MANAGER: "true"
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 📦 Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 🐳 Login to Harbor
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: admin
        password: ${{ secrets.HARBOR_ADMIN_PASSWORD }}
    - name: 📦 Push Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/cluster-api-outscale-controllers"
        IMAGE_TAG: "${{ github.sha }}-amd64"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/cluster-api-outscale-controllers"
        REGISTRY_TAG: ${{ github.sha }}
    - name: 🔎 Preloader snapshot
      id: preloader
      uses: outscale/k8s-image-preloader/github_actions/preloader_snapshot@91094d173e5a06bfc9c2d7c7792e7128b6a1a7c2 # v0.3.0
      with:
        KUBECONFIG: ${{ steps.management.outputs.KUBECONFIG }}
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CSI: true
    - name: 🔐 Create CAPOSC ns and credentials
      run: make credentials
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.management.outputs.KUBECONFIG }}"
    - name: 🧪 Launch quickstart e2e tests
      run: |
        from=`echo ${{ vars.IMG_UPGRADE_FROM }} | sed 's/.*kubernetes-\(v[^-]*\)-.*/\1/'`
        to=`echo ${{ vars.IMG_UPGRADE_TO }} | sed 's/.*kubernetes-\(v[^-]*\)-.*/\1/'`
        export KUBERNETES_VERSION=$from
        export KUBERNETES_VERSION_UPGRADE_FROM=$from
        export KUBERNETES_VERSION_UPGRADE_TO=$to
        make e2etest
      shell: bash
      id: e2etest
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.management.outputs.KUBECONFIG }}"
        CCM_OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        CCM_OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        CCM_OSC_REGION: ${{ steps.secrets.outputs.region }}
        IMG: ${{ vars.REGISTRY }}/outscale/cluster-api-outscale-controllers:${{ github.sha }}
        IMG_UPGRADE_FROM: ${{ vars.IMG_UPGRADE_FROM }}
        IMG_UPGRADE_TO: ${{ vars.IMG_UPGRADE_TO }}
        PRELOAD_SNAPSHOT_ID: ${{ steps.preloader.outputs.SNAPSHOT_ID }}
    - name: 📝 Get CAPOSC state/logs
      run: |
        echo "**** pod state"
        kubectl describe po -n cluster-api-provider-outscale-system
        echo "**** pod logs"
        make logs-capo
      if: ${{ failure() && steps.e2etest.conclusion == 'failure' }}
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.management.outputs.KUBECONFIG }}"
        CAPO_NAMESPACE: cluster-api-provider-outscale-system
    - name: 📝 Get cluster api logs
      run: make logs-capi
      if: ${{ failure() && steps.e2etest.conclusion == 'failure' }}
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/${{ steps.management.outputs.KUBECONFIG }}"
        CAPI_NAMESPACE: capi-kubeadm-bootstrap-system
