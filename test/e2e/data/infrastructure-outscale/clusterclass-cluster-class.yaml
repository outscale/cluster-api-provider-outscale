apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: "cluster-class"
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: "cluster-class-control-plane"
    machineInfrastructure:
      ref:
        kind: OscMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        name: "cluster-class-control-plane"
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: OscClusterTemplate
      name: "cluster-class"
  workers:
    machineDeployments:
      - class: cluster-class-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfigTemplate
              name: "cluster-class-worker"
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
              kind: OscMachineTemplate
              name: "cluster-class-worker"
  variables:
    - name: subregions
      required: true
      schema:
        openAPIV3Schema:
          type: array
          items:
            type: string
          default: ["eu-west-2b"]
    - name: controlPlaneVmType
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: tinav6.c4r8p2
    - name: workerVmType
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: tinav6.c4r8p2
  patches:
    - name: oscClusterTemplate
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: OscClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/subregions
              valueFrom:
                variable: subregions
            - op: replace
              path: /spec/template/spec/loadBalancer/name
              valueFrom:
                variable: builtin.cluster.name
    - name: OscMachineTemplateControlPlane
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: OscMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/vm/type
              valueFrom:
                variable: controlPlaneVmType
            - op: replace
              path: /spec/template/spec/vm/subregions
              valueFrom:
                variable: subregions
    - name: OscMachineTemplateControlWorker
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: OscMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - cluster-class-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/vm/type
              valueFrom:
                variable: workerVmType
            - op: replace
              path: /spec/template/spec/vm/subregions
              valueFrom:
                variable: subregions
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscClusterTemplate
metadata:
  name: "cluster-class"
spec:
  template:
    spec:
      subregions:
        - "eu-north-1a"
      loadBalancer:
        name: "REPLACEME"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscMachineTemplate
metadata:
  name: "cluster-class-worker"
spec:
  template:
    spec:
      image:
        name: "${KUBERNETES_IMAGE_UPGRADE_FROM}"
        outscaleOpenSource: true
      vm:
        keypair: "${OSC_KEYPAIR_NAME}"
        subregions:
          - "eu-north-1a"
        type: "tinav9.c1r1p1"
      volumes:
        - root: true
          size: ${OSC_VOLUME_SIZE}
          iops: ${OSC_IOPS}
          type: "${OSC_VOLUME_TYPE}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscMachineTemplate
metadata:
  name: "cluster-class-control-plane"
spec:
  template:
    spec:
      image:
        name: "${KUBERNETES_IMAGE_UPGRADE_FROM}"
        outscaleOpenSource: true
      vm:
        subregions:
          - "eu-north-1a"
        keypair: "${OSC_KEYPAIR_NAME}"
        role: controlplane
        type: "tinav9.c1r1p1"
      volumes:
        - root: true
          size: ${OSC_VOLUME_SIZE}
          iops: ${OSC_IOPS}
          type: "${OSC_VOLUME_TYPE}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "cluster-class-worker"
spec:
  template:
    spec:
      clusterConfiguration:
        apiServer:
          timeoutForControlPlane: 20m0s
      joinConfiguration:
        nodeRegistration:
          name: "{{ ds.meta_data.local_hostname }}"
          kubeletExtraArgs:
            cloud-provider: external
            provider-id: aws:///'{{ ds.meta_data.placement.availability_zone }}'/'{{ ds.meta_data.instance_id }}'
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: "cluster-class-control-plane"
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            timeoutForControlPlane: 20m0s
        initConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.local_hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              provider-id: aws:///'{{ ds.meta_data.placement.availability_zone }}'/'{{ ds.meta_data.instance_id }}'
        joinConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.local_hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              provider-id: aws:///'{{ ds.meta_data.placement.availability_zone }}'/'{{ ds.meta_data.instance_id }}'
