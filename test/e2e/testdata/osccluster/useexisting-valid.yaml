apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscCluster
metadata:
  name: test-cluster-api
  namespace: cluster-api-test
spec:
  useExisting:
    net: true
  net:
    resourceId: vpc-foo
  subnets:
    - roles:
        - worker
      resourceId: subnet-foo
  loadBalancer:
    name: test-cluster-api
    type: internet-facing
  subregionName: eu-west-2a
