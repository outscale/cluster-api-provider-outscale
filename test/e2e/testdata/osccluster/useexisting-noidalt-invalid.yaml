apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscCluster
metadata:
  name: test-cluster-api
  namespace: cluster-api-test
spec:
  useExisting:
    net: true
  nets:
    - ipRange: 10.0.0.0/16
      resourceId: vpc-foo
      subnets:
        - roles:
            - worker
  loadBalancer:
    name: test-cluster-api
    type: internet-facing
  subregions:
   - eu-west-2a
