apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OscMachineTemplate
metadata:
  name: test-cluster-api
  namespace: cluster-api-test
spec:
  template:
    spec:
      image:
        name: test-cluster-api
        outscaleOpenSource: true
      vm:
        keypairName: test-cluster-api
        subregionName: invalid
        vmType: tinav7.c2r4p2
      volumes:
        - root: true
          size: 10
          type: gp2
        - device: /dev/xvdb
          iops: 1000
          size: 10
          type: io1
